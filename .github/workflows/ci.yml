name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Per-SHA concurrency with cancel-in-progress FALSE. Every atomic commit gets
# its own run and shows its own status. Cancelling in-progress runs would leave
# intermediate commits with no verdict, which defeats the point of small commits.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Read by guards that must FAIL rather than SKIP when they cannot run.
  # A conditionally-skipped test is a false green: the run is honest and the
  # assertion simply never executed.
  CI: "true"

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. `scripts/generate_submission.py` reads the FIRST commit for
          # the project start date, which is an eligibility field, and the default
          # depth of 1 makes that the newest commit instead. The generator now refuses
          # on a shallow clone rather than answering wrongly, so without this the
          # submission check cannot run at all.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python from .python-version
        run: uv python install

      - name: Sync workspace (frozen lockfile)
        run: uv sync --all-packages --frozen

      # Each gate runs BARE. No pipe on the exit path, because a pipeline
      # reports its LAST command's status and `cmd | tail` swallows the failure.
      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy strict
        # agents/tests included deliberately. A type check whose argument list
        # omits a directory is structurally incapable of catching anything in
        # it, and this list has already drifted behind the tree once.
        run: uv run mypy core/src agents/src core/tests agents/tests

      - name: pytest
        run: uv run pytest --cov=curtail_core --cov=curtail_agents --cov-report=term-missing --cov-fail-under=90

  browser:
    name: Console in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. `scripts/generate_submission.py` reads the FIRST commit for
          # the project start date, which is an eligibility field, and the default
          # depth of 1 makes that the newest commit instead. The generator now refuses
          # on a shallow clone rather than answering wrongly, so without this the
          # submission check cannot run at all.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Pin Python from .python-version
        run: uv python install

      - name: Sync workspace (frozen lockfile)
        run: uv sync --all-packages --frozen

      # Browsers are not in the lockfile, so this is the step that decides whether
      # the suite below can run at all. `--with-deps` installs the shared libraries
      # Chromium needs on a bare runner.
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      # A SEPARATE INVOCATION, and the pyproject comment explains why: one Playwright
      # test disables pytest-asyncio's auto mode for everything after it, so these
      # cannot share a session with the rest of the suite.
      #
      # Runs BARE, and pytest exits 5 when it collects nothing, so a marker rename
      # that silently emptied this job would FAIL here rather than pass green on zero
      # tests. That is the failure mode this job exists to be immune to.
      - name: pytest -m browser
        run: uv run pytest -m browser -p no:cacheprovider

      # Committed evidence drifts from its generator silently, so the generator is
      # the gate. Bare, so a stale artifact fails the job rather than shipping a
      # judge-facing number the code no longer produces.
      - name: eval artifacts are current
        run: uv run python scripts/export_evals.py --check

      # The chaos drill, run as the COMMAND, not only as its unit tests.
      #
      # The drill is demonstrated live on camera, so the thing that must not rot is
      # the invocation itself: its packaging, its module path, its exit code. Unit
      # tests calling the scenario functions would keep passing while
      # `python -m curtail_agents.chaos` failed to start. Bare, so a non-zero exit
      # fails the job.
      - name: chaos drill
        # `--allow-partial` because this runner has NO cloud credentials, so the
        # poisoned-document scenario cannot reach Model Armor and demonstrates layer 1
        # only. The drill is strict by default on purpose; the leniency is opted into
        # here, where the reason is true, rather than being the binary's default
        # everywhere. `make chaos-recording` is the strict gate, and it is what must
        # pass before the drill is recorded.
        run: uv run python -m curtail_agents.chaos --allow-partial

      # Read the log for PASSED, not just the green check. A green job proves a
      # suite RAN; it does not prove any assertion executed.
      # GitHub runs `run:` under `bash -e`, so a failing command aborts the step
      # before any `rc=$?` line executes. Every exit code below is captured with
      # `|| rc=$?` so the check reasons about the real status instead of never
      # running at all.
      # Parses JUnit XML rather than grepping pytest's human-readable summary.
      # The first version of this guard grepped for a "N passed" line and went
      # red because `addopts` already carries -q and the extra -q made it -qq,
      # which suppresses that line entirely. The guard was right to refuse, but
      # its premise was fragile. Machine-readable counts cannot be reformatted
      # out from under it.
      # Named separately so a judge or reviewer can see the honesty gate as its
      # own line in the checks list, rather than buried inside the suite.
      - name: Citation guard (no fabricated authority ships)
        run: uv run pytest core/tests/test_citation_guard.py -q

      - name: Assert the suite ran and nothing was skipped
        run: |
          rc=0
          uv run pytest --junitxml=/tmp/junit.xml || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::pytest failed (exit $rc)"
            exit 1
          fi
          uv run python scripts/check_suite_integrity.py /tmp/junit.xml

      # Every number in the video narration, the README, the landing page and the
      # Devpost description is required to come from docs/FACTS.md, and that file
      # is generated rather than written. If it drifts from the code that produces
      # it, an artifact quoting it may be quoting a figure the repository no
      # longer supports, and a published video cannot be corrected afterwards.
      # Runs bare: no pipe on the exit path.
      - name: FACTS.md matches the code that generates it
        run: uv run python scripts/generate_facts.py --check

      # Named separately so the provenance of the headline metric is visible as
      # its own line in the checks list. The corpus is gitignored, so CI checks
      # the committed verification record rather than the PDFs; the record is
      # produced locally by scripts/verify_backtest_quotes.py against real bytes.
      # Runs bare: no pipe on the exit path.
      - name: Backtest quotes trace to their documents
        run: uv run pytest core/tests/test_backtest_quote_provenance.py -q

  hygiene:
    name: Hygiene (AI tone, em-dash)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. `scripts/generate_submission.py` reads the FIRST commit for
          # the project start date, which is an eligibility field, and the default
          # depth of 1 makes that the newest commit instead. The generator now refuses
          # on a shallow clone rather than answering wrongly, so without this the
          # submission check cannot run at all.
          fetch-depth: 0

      - name: AI-tone gate
        run: bash scripts/check-ai-tone.sh

      # Independent of the script above, and deliberately duplicated. This
      # matches the raw UTF-8 bytes so this workflow file stays em-dash free
      # itself rather than containing the character it bans.
      - name: Em-dash gate (raw bytes, whole tree)
        run: |
          # Capture git grep's OWN exit code. Wrapping this in `if` would make
          # `$?` report the if-statement, so an errored grep (rc>=2) would fall
          # through and read as clean, which is the exact defect this gate
          # exists to catch.
          rc=0
          out=$(git grep -n -I "$(printf '\xe2\x80\x94')" -- .) || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "::error::git grep errored (rc=$rc). Counting as failure, not a pass."
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "$out"
            echo "::error::Em-dash (U+2014) found. The constitution bans it everywhere."
            exit 1
          fi
          echo "clean: no em-dash in tracked files"

      - name: Prove the em-dash gate is not vacuous
        run: |
          # Mutation check: the gate must FAIL on a file that contains the
          # character. Without this, a broken pattern would pass forever while
          # protecting nothing.
          printf 'probe \xe2\x80\x94 probe\n' > /tmp/probe.md
          if grep -q "$(printf '\xe2\x80\x94')" /tmp/probe.md; then
            echo "confirmed: the pattern matches a known-bad sample"
          else
            echo "::error::The em-dash pattern does not match a known em-dash. Gate is broken."
            exit 1
          fi

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. A secret committed and then deleted still lives in
          # history, and a working-tree-only scan reports clean.
          fetch-depth: 0

      # The docker form on purpose. gitleaks-action crashes on initial-push
      # events; the container does not. Run BARE so a docker failure cannot be
      # swallowed and silently skip the scan.
      - name: gitleaks (all refs)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --no-banner --exit-code 1
