[project]
name = "curtail-agents"
version = "0.1.0"
description = "ADK agent fleet: Gage Sentinel, Order Scribe, Herald, Season Ledger, Gemma Normalizer."
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk>=2.6.3,<2.7",
    # WIRED, and audited that way. An earlier version of this list declared four
    # dependencies that nothing imported: fastapi, structlog, pydantic and
    # google-cloud-pubsub. A dependency list is a claim about what a project uses,
    # checkable by anyone in one grep, and four of them were false. The wired-or-cut
    # rule applies here exactly as it applies to a README.
    #
    # fastapi and structlog serve the console API in `api.py`. httpx is the gage
    # client's transport and also FastAPI's test client. pydantic arrives through
    # google-adk and is not declared directly, because declaring a transitive
    # dependency you never import is the same false claim in a quieter form.
    # google-cloud-pubsub is KEPT, and the first attempt at this audit cut it
    # wrongly. `messaging.py` needs no client, but `test_messaging.py` imports
    # `google.pubsub_v1.types` to assert the real library supports the dead-letter
    # policy and delivery-attempt bounds we configure, which is a conformance check
    # worth more than the dependency costs. The guard now scans tests as well as
    # source, because a package used only by tests is still used.
    "fastapi>=0.141.1,<0.142",
    "structlog>=26.1.0,<27",
    "httpx>=0.28.1,<0.29",
    "curtail-core",
    # The Season Ledger's durability is the track's "weeks of asynchronous
    # operations" criterion, and durability means a session service that survives
    # the process. `DatabaseSessionService` is that service, ADK ships it behind
    # the `db` extra, and it is the same class Cloud SQL uses in production, so
    # what the tests exercise on SQLite is the production code path with a
    # different URL. Upper-bounded like every other pin: this repo sits frozen
    # through a month of judging and an unpinned dependency turns it red with
    # nobody touching the code.

    "greenlet>=3.2,<4",
    "google-cloud-pubsub>=2.31,<3",
    # The ASGI server Cloud Run runs. Invoked as a command, never imported, so it is
    # registered in the manifest guard's RUNTIME_ONLY table with that reason rather
    # than tripping the unused-dependency check.
    "uvicorn>=0.41,<0.42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curtail_agents"]

# The citation allowlist lives INSIDE the package, and that is the whole fix.
#
# It began at the repo root with `_CITATIONS_PATH` resolving through
# `parents[3]`, which is the repo root ONLY in a source checkout. Installed
# non-editable, that path lands above site-packages and the citation guard
# raises FileNotFoundError on the first drafted order.
#
# The first attempt kept the file at the root and used a cross-root
# force-include. That FAILED TO BUILD: uv builds from an sdist, so `../docs`
# is outside the build root and hatchling cannot reach it. The plan for this
# task predicted that reaching for a multi-path loader would signal the
# packaging was still wrong, and it did. One file, in the package, is the
# answer; everything else reads it from there.

[tool.uv.sources]
curtail-core = { workspace = true }
