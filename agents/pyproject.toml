[project]
name = "curtail-agents"
version = "0.1.0"
description = "ADK agent fleet: Gage Sentinel, Order Scribe, Herald, Season Ledger, Gemma Normalizer."
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk>=2.6.3,<2.7",
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.4,<3",
    "structlog>=26.1.0,<27",
    "httpx>=0.28.1,<0.29",
    "curtail-core",
    "google-cloud-pubsub>=2.31,<3",
    # The Season Ledger's durability is the track's "weeks of asynchronous
    # operations" criterion, and durability means a session service that survives
    # the process. `DatabaseSessionService` is that service, ADK ships it behind
    # the `db` extra, and it is the same class Cloud SQL uses in production, so
    # what the tests exercise on SQLite is the production code path with a
    # different URL. Upper-bounded like every other pin: this repo sits frozen
    # through a month of judging and an unpinned dependency turns it red with
    # nobody touching the code.
    "sqlalchemy>=2.0.51,<2.1",
    "aiosqlite>=0.21,<0.22",
    "greenlet>=3.2,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curtail_agents"]

# The citation allowlist lives INSIDE the package, and that is the whole fix.
#
# It began at the repo root with `_CITATIONS_PATH` resolving through
# `parents[3]`, which is the repo root ONLY in a source checkout. Installed
# non-editable, that path lands above site-packages and the citation guard
# raises FileNotFoundError on the first drafted order.
#
# The first attempt kept the file at the root and used a cross-root
# force-include. That FAILED TO BUILD: uv builds from an sdist, so `../docs`
# is outside the build root and hatchling cannot reach it. The plan for this
# task predicted that reaching for a multi-path loader would signal the
# packaging was still wrong, and it did. One file, in the package, is the
# answer; everything else reads it from there.

[tool.uv.sources]
curtail-core = { workspace = true }
