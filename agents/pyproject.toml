[project]
name = "curtail-agents"
version = "0.1.0"
description = "ADK agent fleet: Gage Sentinel, Order Scribe, Herald, Season Ledger, Gemma Normalizer."
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk>=2.6.3,<2.7",
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.4,<3",
    "structlog>=26.1.0,<27",
    "httpx>=0.28.1,<0.29",
    "curtail-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curtail_agents"]

[tool.uv.sources]
curtail-core = { workspace = true }
