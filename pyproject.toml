[project]
name = "curtail"
version = "0.1.0"
description = "A governed multi-agent fleet for prior-appropriation water curtailment administration"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
readme = "README.md"
dependencies = []

# Python is capped below 3.14 on purpose. Pydantic dropped v1 support starting
# with Python 3.14, and the whole backend is Pydantic v2. The machine building
# this ships 3.14 as its system interpreter, so uv pins 3.13 explicitly rather
# than inheriting whatever is on PATH.

[tool.uv.workspace]
members = ["core", "agents"]

[dependency-groups]
# Every dev tool carries an upper bound. A submitted repo sits untouched through
# a month of judging while its CI keeps resolving unpinned ranges to whatever
# shipped since. An unpinned linter is a time bomb that turns a frozen repo red
# with nobody touching the code.
dev = [
    "ruff>=0.16.2,<0.17",
    "mypy>=2.3.0,<2.4",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.0.0,<8",
    "hypothesis>=6.165.2,<7",
    # Used by the CI suite-integrity guard to parse pytest's JUnit XML. The file
    # is self-generated and trusted, but stdlib ElementTree is vulnerable to
    # entity-expansion attacks and there is no reason for a security gate to
    # rest on a parser with a known weakness.
    "defusedxml>=0.7.1,<0.8",
    "pytest-asyncio>=1.4.0,<2",
    # Drives the console in a real Chromium. The defects it covers live in browser
    # control flow (an unguarded await, a fallback on a missing field, two responses
    # racing to write one element) and no in-process client reaches any of them.
    #
    # It is why the default run carries `-m "not browser"`: this plugin's call hook
    # disables pytest-asyncio's auto mode for every async test that runs after it in
    # the same session. See [tool.pytest.ini_options] and the guard in
    # core/tests/test_browser_suite_is_actually_run.py.
    "pytest-playwright>=0.9.0,<0.10",
    # Reads the CI workflow in that guard. Declared rather than borrowed from the
    # transitive tree: an import with no declaration behind it is the mirror of the
    # four declared-but-unimported dependencies this project already had to cut, and
    # it breaks on the first clean install rather than here.
    "pyyaml>=6.0.3,<7",
    "types-pyyaml>=6.0.12,<7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["core/src", "agents/src"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime misuse, which matters when every timestamp is legal evidence
    "RUF",       # ruff-specific
]
# E501 stays ON. A prior cycle lost CI to a 101 character comment; the fix is to
# wrap lines, not to disable the rule.

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
# The order-parser fixtures are government documents quoted character for
# character. E501 would force rewrapping a line the Board actually wrapped
# elsewhere, and RUF001 flags the en-dash in "Addendum 6 - Full Suspension",
# which is the Board's own typography. Both are correct defaults and both are
# wrong here: a fixture retyped in tidier punctuation stops being evidence of
# what the parser meets in production. Scoped to this one file deliberately.
"core/tests/test_order_parser.py" = ["B011", "E501", "RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
# `scripts` is on the path because tests import the corpus tooling to guard it,
# for example asserting that every computed Extraction field is serialised. CI
# type-checks `core/tests` as well as the source, so a script imported by a test
# has to resolve here or the check fails in CI while passing locally.
mypy_path = ["core/src", "agents/src", "scripts"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "agents/tests"]
pythonpath = ["core/src", "agents/src"]
# `-m "not browser"` is a SEPARATION, not a silent exclusion, and it is forced by a
# real plugin conflict rather than by taste. A single Playwright test poisons every
# async test that runs after it in the same session: pytest-playwright's call hook
# takes over, pytest-asyncio's auto mode stops applying, and later async tests are
# invoked as plain functions whose coroutines are discarded. The symptom is
# "coroutine ... was never awaited" on tests that pass perfectly on their own, and
# it took 26 unrelated failures to surface it.
#
# Deselection like this is one commit away from becoming "those tests never run
# again", which is the false-green shape this project keeps meeting. Two things stop
# that: a dedicated CI job runs `-m browser`, and a test in the DEFAULT suite asserts
# that job still exists and still runs it.
addopts = "-q --strict-markers --strict-config -m 'not browser'"
asyncio_mode = "auto"
markers = [
    "browser: drives a real Chromium. Run separately via `make test-browser`.",
]
filterwarnings = [
    # Warnings are errors. That is what surfaced everything below, and it stays.
    "error",
    # google-adk 2.6.3 subclasses its OWN deprecated BaseAgentConfig at import
    # time, so merely importing google.adk.workflow raises under -W error. This
    # is a third-party defect, not ours, and it is scoped to that exact message
    # rather than relaxed globally: a blanket ignore would also hide a
    # deprecation in our own code, which is the thing this setting is for.
    # Revisit when the pinned ADK version moves.
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    # Starlette warns that its TestClient uses httpx rather than httpx2. That is a
    # third-party transition, not our code, and the alternative is either dropping
    # the API tests or adding a dependency for a warning. Scoped to that exact
    # message rather than relaxed, and revisit when the pinned FastAPI moves.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
]
